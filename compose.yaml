# Environnement de développement PENDERIE.
# Les mots de passe ci-dessous ne servent qu'en local : ils ne protègent rien
# et ne doivent jamais être réutilisés en production.
services:
  php:
    build: ./docker/php
    # Au premier démarrage, le volume vendor est vide : on installe les dépendances dans le conteneur.
    command: sh -c "([ -f vendor/autoload.php ] || composer install --no-interaction) && mkdir -p var/storage/default var/storage/test && exec php-fpm"
    volumes:
      - ./api:/var/www/api
      # vendor/ et var/ restent dans Docker, hors du dossier partagé avec Windows : en mode dev, Symfony
      # vérifie des milliers de fichiers à chaque requête, et le partage Windows les rend 50 fois plus lents.
      - api_vendor:/var/www/api/vendor
      - api_var:/var/www/api/var
    environment:
      DATABASE_URL: "mysql://${MYSQL_USER:-penderie}:${MYSQL_PASSWORD:-penderie}@database:3306/${MYSQL_DATABASE:-penderie}?serverVersion=8.4&charset=utf8mb4"
      MAILER_DSN: "smtp://mailer:1025"
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./api/public:/var/www/api/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-penderie}
      MYSQL_USER: ${MYSQL_USER:-penderie}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-penderie}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3307:3306"
    volumes:
      - database_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailer:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"

  front:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - ./front:/app
      # Même raison que vendor/ côté API : les dépendances restent dans Docker.
      - front_node_modules:/app/node_modules
    environment:
      # Rendu serveur : l'API est jointe par le réseau Docker. Navigateur : par le port publié.
      NUXT_API_BASE_SERVEUR: "http://nginx"
      NUXT_PUBLIC_API_BASE: "http://localhost:8080"
      # Relire les fichiers régulièrement : sous Windows, les changements n'arrivent pas jusqu'au conteneur.
      SCRUTATION_FICHIERS: "1"
    profiles: ["front"]

volumes:
  database_data:
  api_vendor:
  api_var:
  front_node_modules:

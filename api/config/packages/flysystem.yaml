# Read the documentation at https://github.com/thephpleague/flysystem-bundle/blob/master/docs/1-getting-started.md
flysystem:
    storages:
        default.storage:
            adapter: 'local'
            options:
                directory: '%kernel.project_dir%/var/storage/default'

when@test:
    flysystem:
        storages:
            default.storage:
                adapter: 'local'
                options:
                    # Les photos envoyées par les tests ne se mélangent pas à celles du développement.
                    directory: '%kernel.project_dir%/var/storage/test'

# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # Reconnaissance des photos (D-040, D-041). La lecture se fait pendant que la fiche est déjà ouverte :
    # on laisse donc à Google jusqu'à 20 s par modèle (3 à 40 s mesurés le 16/10/2026, selon sa charge).
    # Si le principal refuse ou tarde, le modèle de secours prend le relais (ReconnaissanceArticles).
    http_client:
        scoped_clients:
            reconnaissance.client:
                base_uri: '%env(RECONNAISSANCE_URL)%'
                timeout: 20
                max_duration: 20

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
        # Aucun appel réel au modèle pendant les tests.
        http_client:
            mock_response_factory: App\Tests\Double\ModeleSimule

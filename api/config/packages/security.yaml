security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # Connexion par e-mail ou par pseudo : voir UtilisateurRepository::loadUserByIdentifier()
        utilisateurs:
            entity:
                class: App\Entity\Utilisateur

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # POST /api/auth/connexion : vérifie identifiant + mot de passe, renvoie un JWT (D-015)
        connexion:
            pattern: ^/api/auth/connexion$
            stateless: true
            provider: utilisateurs
            json_login:
                check_path: /api/auth/connexion
                username_path: identifiant
                password_path: motDePasse
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # Reste de l'API : le JWT est lu dans le cookie BEARER (front) ou l'en-tête Authorization (Postman).
        # Une requête sans jeton reste anonyme : chaque route décide si elle l'accepte.
        api:
            pattern: ^/api
            stateless: true
            provider: utilisateurs
            jwt: ~

    # Interdit par défaut (D-014) : chaque route publique est listée explicitement.
    access_control:
        - { path: ^/api/auth/(inscription|connexion|deconnexion)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api$, roles: PUBLIC_ACCESS }
        - { path: ^/api/categories$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/moi, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Hachage volontairement faible en test, pour la rapidité uniquement.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10

; Photos des articles : 10 Mo maximum (contrat d'API, POST /api/reconnaissances)
upload_max_filesize = 10M
post_max_size = 12M
memory_limit = 256M
date.timezone = Europe/Paris

; Cache des fichiers PHP aussi en ligne de commande : PHPUnit relit sinon tout le code à chaque test,
; ce qui est très lent sur un dossier Windows monté dans Docker (4 min 17 s → 35 s pour 73 tests).
opcache.enable_cli = 1

; PCOV mesure la couverture des tests : désactivé par défaut (il ralentit chaque requête),
; activé à la demande par make couverture (php -d pcov.enabled=1).
pcov.enabled = 0
